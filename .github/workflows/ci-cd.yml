name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '20.x'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Backend — typecheck + migrate + test
  # ─────────────────────────────────────────
  backend:
    name: Backend — Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_TEST_PASSWORD || 'ci_test_password' }}
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.DB_TEST_PASSWORD || 'ci_test_password' }}@localhost:5432/taskmanager_test
      JWT_SECRET: ${{ secrets.JWT_TEST_KEY || 'ci_test_jwt_secret' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      - name: Typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Aplicar migraciones
        working-directory: ./backend
        run: npm run prisma:migrate:deploy

      - name: Ejecutar tests
        working-directory: ./backend
        run: npm test

  # ─────────────────────────────────────────
  # JOB 2: Frontend — build de producción
  # ─────────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Build de producción
        working-directory: ./frontend
        run: npm run build:prod

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 3: Deploy — solo al mergear PR a main
  # ─────────────────────────────────────────
  deploy:
    name: Deploy a Railway
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy a Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN no configurado — deploy omitido"
            exit 0
          fi
          railway up --service task-manager-backend --detach
          railway up --service task-manager-frontend --detach
          echo "Deploy disparado — $(date)"
