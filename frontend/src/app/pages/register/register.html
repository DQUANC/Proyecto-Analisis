<!-- ── Estética glassmorphism consistente con la pantalla de login,
     adaptada a la identidad Nexora. -->
<div class="page">

  <!-- Esferas decorativas de fondo (puramente visuales, sin contenido) -->
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>
  <div class="bg-orb orb-3" aria-hidden="true"></div>

  <div class="glass-card">
    <div class="brand">
      <img src="assets/logos/logotipo-monocromo-navy.png" alt="Nexora">
      <p class="tagline">Crea tu cuenta</p>
    </div>

    <h2>Registro</h2>
    <form (ngSubmit)="submit()">
      <label>Nombre
        <input type="text" [(ngModel)]="name" name="name" required />
      </label>
      <label>Correo Electrónico
        <input type="email" [(ngModel)]="email" name="email" required />
      </label>
      <label>Contraseña
        <input type="password" [(ngModel)]="password" name="password" required />
      </label>
      <label>Departamento
        <select [(ngModel)]="departmentId" name="departmentId">
          <option [value]="null">-- Seleccionar departamento --</option>
          @for (d of departments; track d.id) {
            <option [value]="d.id">{{ d.name }}</option>
          }
        </select>
      </label>
      @if (error) {
        <p class="error">{{ error }}</p>
      }
      <button type="submit" [disabled]="loading">{{ loading ? 'Registrando...' : 'Crear Cuenta' }}</button>
    </form>
    <p class="signup-link">¿Ya tienes una cuenta? <a routerLink="/login">Iniciar Sesión</a></p>
  </div>

</div>
