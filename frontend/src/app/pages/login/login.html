<!-- ── Pantalla unificada con estética glassmorphism (adaptada de la
     propuesta de diseño en DO_NOT_MERGE/Nexora_Identidad_Grafica/propuesta-login.webp)
     Fondo navy oscuro con esferas translúcidas teal flotando + tarjeta de
     vidrio esmerilado centrada con el formulario de login. -->
<div class="login-layout">

  <!-- Esferas decorativas de fondo (puramente visuales, sin contenido) -->
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>
  <div class="bg-orb orb-3" aria-hidden="true"></div>

  <!-- Tarjeta de vidrio con branding + formulario -->
  <div class="glass-card">
    <div class="brand">
      <img src="assets/logos/logotipo-monocromo-navy.png" alt="Nexora">
      <p class="tagline">Gestiona tu equipo con precision</p>
    </div>

    <h2>Inicio de Sesion</h2>

    <form (ngSubmit)="submit()">
      <label>Correo Electronico
        <input type="email" [(ngModel)]="email" name="email" required placeholder="correo@empresa.com" />
      </label>
      <label>Contrasena
        <input type="password" [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </label>

      <a class="forgot-link" href="javascript:void(0)">¿Olvidaste tu contraseña?</a>

      <p class="error" *ngIf="error">{{ error }}</p>
      <button type="submit" [disabled]="loading">{{ loading ? 'Ingresando...' : 'Iniciar Sesion' }}</button>
    </form>

    <p class="signup-link">¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
  </div>

</div>
