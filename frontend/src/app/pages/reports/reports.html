<div class="page">
  <header>
    <div class="header-brand">
      <img class="header-logo" src="assets/logos/logotipo-monocromo-navy.png" alt="Nexora">
      <h1>Reportes</h1>
    </div>
    <nav>
      <a routerLink="/dashboard">← Panel De Control</a>
      <a routerLink="/tasks">Tareas</a>
      <button class="logout" (click)="logout()">Cerrar Sesión</button>
    </nav>
  </header>

  <section class="report-box">
    <h2>Generar Reporte en PDF</h2>
    <p class="hint">Selecciona el tipo de reporte y descarga un PDF con la información correspondiente.</p>

    <div class="form-row">
      <label>Tipo De Reporte
        <select [(ngModel)]="selectedType" name="reportType">
          <option *ngFor="let opt of reportOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </label>

      <button class="btn-primary" (click)="generatePdf()" [disabled]="loading">
        {{ loading ? 'Generando...' : 'Generar PDF' }}
      </button>
    </div>

    <p *ngIf="loading" class="loading">Obteniendo datos, por favor espera...</p>
    <p class="error" *ngIf="error">{{ error }}</p>
  </section>
</div>
