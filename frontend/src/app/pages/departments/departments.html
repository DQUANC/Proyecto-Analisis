<div class="page">
  <header>
    <div class="header-brand">
      <img class="header-logo" src="assets/logos/logotipo-monocromo-navy.png" alt="Nexora">
      <h1>Areas de Trabajo</h1>
    </div>
    <nav>
      <a routerLink="/dashboard">← Panel de Control</a>
      <a *ngIf="isAdmin" routerLink="/reports">Reportes</a>
    </nav>
  </header>

  <div class="form-row">
    <input type="text" [(ngModel)]="newName" placeholder="Nombre del area de trabajo..." />
    <button (click)="create()">Agregar</button>
  </div>

  <p *ngIf="loading">Cargando...</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <div class="table-wrap" *ngIf="!loading && departments.length">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of departments">
          <td>
            <span *ngIf="editId !== d.id">{{ d.name }}</span>
            <input *ngIf="editId === d.id" type="text" [(ngModel)]="editName" />
          </td>
          <td>
            <button *ngIf="editId !== d.id" (click)="startEdit(d)">Editar</button>
            <button *ngIf="editId === d.id" class="save" (click)="saveEdit()">Guardar</button>
            <button class="del" (click)="remove(d.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <p *ngIf="!loading && !departments.length && !error">No hay areas de trabajo registradas.</p>
</div>
