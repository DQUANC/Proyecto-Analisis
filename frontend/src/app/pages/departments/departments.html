<div class="page">
  <header>
    <!-- ORTOGRAFÍA: 'Departments' → 'Departamentos' -->
    <h1>Departamentos</h1>
    <!-- ORTOGRAFÍA: '← Dashboard' → '← Panel de Control' -->
    <a routerLink="/dashboard">← Panel de Control</a>
  </header>

  <div class="form-row">
    <!-- ORTOGRAFÍA: 'New department name' → 'Nombre del departamento' -->
    <input type="text" [(ngModel)]="newName" placeholder="Nombre del departamento" />
    <!-- ORTOGRAFÍA: 'Add' → 'Agregar' -->
    <button (click)="create()">Agregar</button>
  </div>

  <!-- ORTOGRAFÍA: 'Loading...' → 'Cargando...' -->
  <p *ngIf="loading">Cargando...</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <table *ngIf="!loading && departments.length">
    <thead>
      <tr>
        <!-- ORTOGRAFÍA: 'Name' → 'Nombre' / 'Actions' → 'Acciones' -->
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of departments">
        <td>
          <span *ngIf="editId !== d.id">{{ d.name }}</span>
          <input *ngIf="editId === d.id" type="text" [(ngModel)]="editName" />
        </td>
        <td>
          <!-- ORTOGRAFÍA: 'Edit' → 'Editar' / 'Save' → 'Guardar' / 'Delete' → 'Eliminar' -->
          <button *ngIf="editId !== d.id" (click)="startEdit(d)">Editar</button>
          <button *ngIf="editId === d.id" (click)="saveEdit()">Guardar</button>
          <button class="del" (click)="remove(d.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- ORTOGRAFÍA: 'No departments yet.' → 'No hay departamentos aún.' -->
  <p *ngIf="!loading && !departments.length && !error">No hay departamentos aún.</p>
</div>
