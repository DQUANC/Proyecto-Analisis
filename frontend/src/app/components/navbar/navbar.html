<header>
  <div class="header-brand">
    <img class="header-logo" src="assets/logos/logotipo-monocromo-navy.png" alt="Nexora">
  </div>
  <nav>
    <a *ngIf="isAdmin" routerLink="/dashboard" routerLinkActive="active">Panel</a>
    <a routerLink="/tasks" routerLinkActive="active">Tareas</a>
    <a routerLink="/history" routerLinkActive="active">Historial</a>
    <a *ngIf="isAdmin" routerLink="/users" routerLinkActive="active">Usuarios</a>
    <a *ngIf="isAdmin" routerLink="/departments" routerLinkActive="active">Áreas</a>
    <a *ngIf="isAdmin" routerLink="/reports" routerLinkActive="active">Reportes</a>
    <span class="current-user" *ngIf="currentUser" [title]="currentUser.email">
      <span class="current-user-name">{{ currentUser.name }}</span>
      <span class="current-user-role" [class.role-super]="currentUser.isSuperUser">{{ roleLabel }}</span>
    </span>
    <button class="logout" (click)="logout()">Cerrar Sesión</button>
  </nav>
</header>
